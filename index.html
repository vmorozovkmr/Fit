<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Трекер • Вениамин & Дарья</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg: #0c0e14;
      --card: #14171f;
      --border: #1e2230;
      --text: #e6e8ee;
      --muted: #8b90a0;
      --primary: #6b8cff;
      --green: #4ade80;
      --orange: #fbbf24;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 24px 16px;
      line-height: 1.5;
    }

    .container {
      max-width: 960px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 32px;
    }

    header h1 {
      font-size: 1.6rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      margin-bottom: 4px;
    }

    header p {
      color: var(--muted);
      font-size: 0.9rem;
    }

    /* Статистика */
    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-bottom: 28px;
    }

    .stat-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      text-align: center;
    }

    .stat-card .label {
      font-size: 0.75rem;
      color: var(--muted);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    .stat-card .value {
      font-size: 1.35rem;
      font-weight: 600;
    }

    .ven .value { color: var(--primary); }
    .dar .value { color: var(--green); }

    /* Форма */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 22px;
      margin-bottom: 24px;
    }

    .card h2 {
      font-size: 1.05rem;
      font-weight: 600;
      margin-bottom: 18px;
      color: var(--text);
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 14px;
      margin-bottom: 14px;
    }

    label {
      display: block;
      font-size: 0.78rem;
      color: var(--muted);
      margin-bottom: 5px;
    }

    input, select, textarea {
      width: 100%;
      padding: 9px 12px;
      background: #0c0e14;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 0.92rem;
      transition: border-color 0.15s;
    }

    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--primary);
    }

    textarea {
      min-height: 68px;
      resize: vertical;
    }

    .btn-row {
      display: flex;
      gap: 10px;
      margin-top: 8px;
    }

    button {
      padding: 10px 18px;
      border-radius: 8px;
      font-weight: 500;
      font-size: 0.9rem;
      cursor: pointer;
      border: none;
      transition: opacity 0.15s;
    }

    .btn-primary {
      background: var(--primary);
      color: white;
    }

    .btn-secondary {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
    }

    button:hover { opacity: 0.88; }

    .status {
      margin-top: 12px;
      font-size: 0.87rem;
      min-height: 20px;
    }
    .status.success { color: var(--green); }
    .status.error { color: #f87171; }
    .status.loading { color: var(--orange); }

    .hidden { display: none !important; }

    /* Графики */
    .chart-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 20px;
    }

    .chart-card h3 {
      font-size: 0.95rem;
      font-weight: 500;
      color: var(--muted);
      margin-bottom: 14px;
    }

    .chart-container {
      position: relative;
      height: 260px;
    }

    @media (max-width: 700px) {
      .stats { grid-template-columns: repeat(2, 1fr); }
      header h1 { font-size: 1.4rem; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Трекер</h1>
      <p>Вениамин & Дарья</p>
    </header>

    <!-- Статистика -->
    <div class="stats">
      <div class="stat-card ven">
        <div class="label">Вен • сожжено</div>
        <div class="value" id="statVenBurn">—</div>
      </div>
      <div class="stat-card dar">
        <div class="label">Дарья • сожжено</div>
        <div class="value" id="statDarBurn">—</div>
      </div>
      <div class="stat-card ven">
        <div class="label">Вен • съедено</div>
        <div class="value" id="statVenEat">—</div>
      </div>
      <div class="stat-card dar">
        <div class="label">Дарья • съедено</div>
        <div class="value" id="statDarEat">—</div>
      </div>
    </div>

    <!-- Форма -->
    <div class="card">
      <h2>Новая запись</h2>

      <form id="trackerForm">
        <div class="form-grid">
          <div>
            <label>Тип</label>
            <select id="targetSheet">
              <option value="КБЖУ и Питание">Питание</option>
              <option value="Активность">Активность</option>
            </select>
          </div>
          <div>
            <label>Дата</label>
            <input type="date" id="inputDate">
          </div>
          <div>
            <label>Участник</label>
            <select id="inputName">
              <option value="Вениамин">Вениамин</option>
              <option value="Дарья">Дарья</option>
            </select>
          </div>
        </div>

        <!-- Питание -->
        <div id="nutritionFields">
          <div class="form-grid">
            <div>
              <label>Прием пищи</label>
              <select id="inputMeal">
                <option value="Завтрак">Завтрак</option>
                <option value="Обед">Обед</option>
                <option value="Ужин">Ужин</option>
                <option value="Перекус">Перекус</option>
              </select>
            </div>
            <div>
              <label>Блюдо / Продукт</label>
              <input type="text" id="inputDish" placeholder="Что ел(а)">
            </div>
            <div>
              <label>Вес (г)</label>
              <input type="number" id="inputWeight" min="0" placeholder="0">
            </div>
            <div>
              <label>Калории</label>
              <input type="number" id="inputCalories" min="0" placeholder="0">
            </div>
            <div>
              <label>Белки</label>
              <input type="number" id="inputProtein" min="0" step="0.1" placeholder="0">
            </div>
            <div>
              <label>Жиры</label>
              <input type="number" id="inputFat" min="0" step="0.1" placeholder="0">
            </div>
            <div>
              <label>Углеводы</label>
              <input type="number" id="inputCarbs" min="0" step="0.1" placeholder="0">
            </div>
          </div>
        </div>

        <!-- Активность -->
        <div id="activityFields" class="hidden">
          <div class="form-grid">
            <div>
              <label>Вид активности</label>
              <select id="inputActivity">
                <option value="Силовая (зал)">Силовая (зал)</option>
                <option value="Кардио">Кардио</option>
                <option value="Домашняя тренировка">Домашняя</option>
                <option value="Прогулка">Прогулка</option>
                <option value="Бег">Бег</option>
                <option value="Другое">Другое</option>
              </select>
            </div>
            <div>
              <label>Локация</label>
              <select id="inputLocation">
                <option value="Зал">Зал</option>
                <option value="Дом">Дом</option>
                <option value="Улица">Улица</option>
                <option value="Парк">Парк</option>
              </select>
            </div>
            <div>
              <label>Минут</label>
              <input type="number" id="inputDuration" min="0" placeholder="0">
            </div>
            <div>
              <label>Сожжено (ккал)</label>
              <input type="number" id="inputBurned" min="0" placeholder="0">
            </div>
          </div>
          <div style="margin-top: 8px;">
            <label>Заметки</label>
            <textarea id="inputNotes" placeholder="Как прошло..."></textarea>
          </div>
        </div>

        <div class="btn-row">
          <button type="submit" class="btn-primary">Сохранить</button>
          <button type="button" class="btn-secondary" id="refreshBtn">Обновить</button>
        </div>

        <div class="status" id="statusMsg"></div>
      </form>
    </div>

    <!-- Графики -->
    <div class="chart-card">
      <h3>Расход калорий</h3>
      <div class="chart-container">
        <canvas id="activityChart"></canvas>
      </div>
    </div>

    <div class="chart-card">
      <h3>Потребление калорий</h3>
      <div class="chart-container">
        <canvas id="nutritionChart"></canvas>
      </div>
    </div>
  </div>

<script>
  const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxcqrKN9yEn-mzbjHNmizhsEtbmBezYIksjg5_IcxgmlDXWjy-FUFQX-VoEauvXtx0/exec';
  const SHEET_ID = '1rYEecH-H5h0zCBcw-dyTcVqO4rCg3vpNh70Q4yW2ns0';
  const API_KEY = 'AIzaSyD6qEm6UvTNbG0vR4cypJX8aZ2C4ZYvNLg';

  const form = document.getElementById('trackerForm');
  const statusMsg = document.getElementById('statusMsg');
  const sheetSelect = document.getElementById('targetSheet');
  const nutritionFields = document.getElementById('nutritionFields');
  const activityFields = document.getElementById('activityFields');

  document.getElementById('inputDate').valueAsDate = new Date();

  sheetSelect.addEventListener('change', () => {
    const isNutrition = sheetSelect.value === 'КБЖУ и Питание';
    nutritionFields.classList.toggle('hidden', !isNutrition);
    activityFields.classList.toggle('hidden', isNutrition);
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    statusMsg.className = 'status loading';
    statusMsg.textContent = 'Сохраняю...';

    const sheetName = sheetSelect.value;
    let values = [];

    if (sheetName === 'КБЖУ и Питание') {
      values = [
        document.getElementById('inputDate').value,
        document.getElementById('inputName').value,
        document.getElementById('inputMeal').value,
        document.getElementById('inputDish').value,
        Number(document.getElementById('inputWeight').value) || 0,
        Number(document.getElementById('inputCalories').value) || 0,
        Number(document.getElementById('inputProtein').value) || 0,
        Number(document.getElementById('inputFat').value) || 0,
        Number(document.getElementById('inputCarbs').value) || 0
      ];
    } else {
      values = [
        document.getElementById('inputDate').value,
        document.getElementById('inputName').value,
        document.getElementById('inputActivity').value,
        document.getElementById('inputLocation').value,
        Number(document.getElementById('inputDuration').value) || 0,
        Number(document.getElementById('inputBurned').value) || 0,
        '',
        document.getElementById('inputNotes').value
      ];
    }

    try {
      await fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify({ sheetName, values })
      });

      statusMsg.className = 'status success';
      statusMsg.textContent = 'Сохранено';

      if (sheetName === 'КБЖУ и Питание') {
        ['inputDish','inputWeight','inputCalories','inputProtein','inputFat','inputCarbs']
          .forEach(id => document.getElementById(id).value = '');
      } else {
        document.getElementById('inputDuration').value = '';
        document.getElementById('inputBurned').value = '';
        document.getElementById('inputNotes').value = '';
      }

      setTimeout(refreshStats, 1500);
    } catch (err) {
      statusMsg.className = 'status error';
      statusMsg.textContent = 'Ошибка';
      console.error(err);
    }
  });

  // Статистика и графики
  let activityChart = null;
  let nutritionChart = null;

  async function fetchSheet(range) {
    try {
      const res = await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/${encodeURIComponent(range)}?key=${API_KEY}`);
      const data = await res.json();
      return data.values || [];
    } catch {
      return [];
    }
  }

  function processData(rows, calIndex) {
    const result = {};
    rows.forEach(row => {
      if (!row || row.length < 2) return;
      const date = row[0];
      const name = row[1];
      const cal = parseInt(row[calIndex]) || 0;
      if (!date || !name) return;
      if (!result[date]) result[date] = { 'Вениамин': 0, 'Дарья': 0 };
      if (name === 'Вениамин' || name === 'Дарья') result[date][name] += cal;
    });
    return result;
  }

  function renderChart(canvasId, data, oldChart) {
    if (oldChart) oldChart.destroy();

    const labels = Object.keys(data).sort();
    const ven = labels.map(d => data[d]['Вениамин'] || 0);
    const dar = labels.map(d => data[d]['Дарья'] || 0);

    return new Chart(document.getElementById(canvasId), {
      type: 'bar',
      data: {
        labels: labels.length ? labels : ['Нет данных'],
        datasets: [
          {
            label: 'Вениамин',
            data: labels.length ? ven : [0],
            backgroundColor: 'rgba(107, 140, 255, 0.75)',
            borderRadius: 4,
            barPercentage: 0.7
          },
          {
            label: 'Дарья',
            data: labels.length ? dar : [0],
            backgroundColor: 'rgba(74, 222, 128, 0.75)',
            borderRadius: 4,
            barPercentage: 0.7
          }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: {
            position: 'top',
            align: 'end',
            labels: {
              color: '#8b90a0',
              boxWidth: 10,
              padding: 16,
              font: { size: 12 }
            }
          }
        },
        scales: {
          x: {
            ticks: { color: '#8b90a0', font: { size: 11 } },
            grid: { display: false }
          },
          y: {
            beginAtZero: true,
            ticks: { color: '#8b90a0', font: { size: 11 } },
            grid: { color: 'rgba(255,255,255,0.04)' }
          }
        }
      }
    });
  }

  async function refreshStats() {
    const [actRows, nutRows] = await Promise.all([
      fetchSheet('Активность!B9:I'),
      fetchSheet('КБЖУ и Питание!B10:J')
    ]);

    const actData = processData(actRows, 5);
    const nutData = processData(nutRows, 5);

    activityChart = renderChart('activityChart', actData, activityChart);
    nutritionChart = renderChart('nutritionChart', nutData, nutritionChart);

    const today = new Date().toISOString().slice(0, 10);
    const findToday = (data) => {
      for (let key in data) {
        if (key.includes(today.slice(5)) || key === today) return data[key];
      }
      return { 'Вениамин': 0, 'Дарья': 0 };
    };

    const actToday = findToday(actData);
    const nutToday = findToday(nutData);

    document.getElementById('statVenBurn').textContent = (actToday['Вениамин'] || 0);
    document.getElementById('statDarBurn').textContent = (actToday['Дарья'] || 0);
    document.getElementById('statVenEat').textContent = (nutToday['Вениамин'] || 0);
    document.getElementById('statDarEat').textContent = (nutToday['Дарья'] || 0);
  }

  document.getElementById('refreshBtn').addEventListener('click', refreshStats);
  refreshStats();
</script>
</body>
</html>
