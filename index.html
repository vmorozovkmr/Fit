<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Трекер • Вениамин & Дарья</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg: #0f1117;
      --card: #1a1d27;
      --border: #2a2e3b;
      --text: #e8eaed;
      --muted: #9aa0a6;
      --primary: #5b8def;
      --green: #34d399;
      --orange: #fbbf24;
      --red: #f87171;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 20px;
      min-height: 100vh;
    }

    .container { max-width: 1100px; margin: 0 auto; }

    header {
      text-align: center;
      margin-bottom: 24px;
    }

    header h1 {
      font-size: 1.7rem;
      font-weight: 700;
      background: linear-gradient(90deg, #5b8def, #34d399);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    header p { color: var(--muted); margin-top: 4px; }

    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 14px;
      margin-bottom: 24px;
    }

    .stat-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
    }

    .stat-card .label { font-size: 0.82rem; color: var(--muted); }
    .stat-card .value { font-size: 1.4rem; font-weight: 700; margin-top: 4px; }
    .ven .value { color: var(--primary); }
    .dar .value { color: var(--green); }

    .form-card, .chart-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 22px;
      margin-bottom: 24px;
    }

    .form-card h2, .chart-card h3 {
      font-size: 1.1rem;
      margin-bottom: 16px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 14px;
      margin-bottom: 14px;
    }

    label {
      display: block;
      font-size: 0.82rem;
      color: var(--muted);
      margin-bottom: 5px;
    }

    input, select, textarea {
      width: 100%;
      padding: 10px 12px;
      background: #12141c;
      border: 1px solid var(--border);
      border-radius: 9px;
      color: var(--text);
      font-size: 0.95rem;
    }

    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--primary);
    }

    textarea { min-height: 70px; resize: vertical; }

    .btn-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 8px;
    }

    button {
      padding: 11px 20px;
      border: none;
      border-radius: 9px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
    }

    .btn-primary {
      background: var(--primary);
      color: white;
    }
    .btn-primary:hover { opacity: 0.9; }

    .btn-secondary {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
    }

    .status {
      margin-top: 12px;
      font-size: 0.9rem;
      min-height: 22px;
    }
    .status.success { color: var(--green); }
    .status.error { color: var(--red); }
    .status.loading { color: var(--orange); }

    .hidden { display: none !important; }

    .chart-container {
      position: relative;
      height: 280px;
    }

    @media (max-width: 600px) {
      body { padding: 12px; }
      header h1 { font-size: 1.35rem; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Трекер активности и питания</h1>
      <p>Вениамин & Дарья</p>
    </header>

    <!-- Сводки -->
    <div class="stats">
      <div class="stat-card ven">
        <div class="label">Вениамин • сожжено сегодня</div>
        <div class="value" id="statVenBurn">—</div>
      </div>
      <div class="stat-card dar">
        <div class="label">Дарья • сожжено сегодня</div>
        <div class="value" id="statDarBurn">—</div>
      </div>
      <div class="stat-card ven">
        <div class="label">Вениамин • съедено сегодня</div>
        <div class="value" id="statVenEat">—</div>
      </div>
      <div class="stat-card dar">
        <div class="label">Дарья • съедено сегодня</div>
        <div class="value" id="statDarEat">—</div>
      </div>
    </div>

    <!-- Форма -->
    <div class="form-card">
      <h2>Добавить запись</h2>

      <form id="trackerForm">
        <div class="form-grid">
          <div>
            <label>Тип записи</label>
            <select id="targetSheet">
              <option value="КБЖУ и Питание">🥗 Питание</option>
              <option value="Активность">🔥 Активность</option>
            </select>
          </div>
          <div>
            <label>Дата</label>
            <input type="date" id="inputDate" required>
          </div>
          <div>
            <label>Участник</label>
            <select id="inputName">
              <option value="Вениамин">Вениамин</option>
              <option value="Дарья">Дарья</option>
            </select>
          </div>
        </div>

        <!-- Питание -->
        <div id="nutritionFields">
          <div class="form-grid">
            <div>
              <label>Прием пищи</label>
              <select id="inputMeal">
                <option value="Завтрак">Завтрак</option>
                <option value="Обед">Обед</option>
                <option value="Ужин">Ужин</option>
                <option value="Перекус">Перекус</option>
              </select>
            </div>
            <div>
              <label>Блюдо / Продукт</label>
              <input type="text" id="inputDish" placeholder="Овсянка, курица...">
            </div>
            <div>
              <label>Вес (г)</label>
              <input type="number" id="inputWeight" min="0" placeholder="0">
            </div>
            <div>
              <label>Калории</label>
              <input type="number" id="inputCalories" min="0" placeholder="0" required>
            </div>
            <div>
              <label>Белки (г)</label>
              <input type="number" id="inputProtein" min="0" step="0.1" placeholder="0">
            </div>
            <div>
              <label>Жиры (г)</label>
              <input type="number" id="inputFat" min="0" step="0.1" placeholder="0">
            </div>
            <div>
              <label>Углеводы (г)</label>
              <input type="number" id="inputCarbs" min="0" step="0.1" placeholder="0">
            </div>
          </div>
        </div>

        <!-- Активность -->
        <div id="activityFields" class="hidden">
          <div class="form-grid">
            <div>
              <label>Вид активности</label>
              <select id="inputActivity">
                <option value="Силовая (зал)">Силовая (зал)</option>
                <option value="Кардио">Кардио</option>
                <option value="Домашняя тренировка">Домашняя тренировка</option>
                <option value="Прогулка">Прогулка</option>
                <option value="Бег">Бег</option>
                <option value="Другое">Другое</option>
              </select>
            </div>
            <div>
              <label>Локация</label>
              <select id="inputLocation">
                <option value="Зал">Зал</option>
                <option value="Дом">Дом</option>
                <option value="Улица">Улица</option>
                <option value="Парк">Парк</option>
              </select>
            </div>
            <div>
              <label>Длительность (мин)</label>
              <input type="number" id="inputDuration" min="0" placeholder="0">
            </div>
            <div>
              <label>Сожжено (ккал)</label>
              <input type="number" id="inputBurned" min="0" placeholder="0" required>
            </div>
          </div>
          <div style="margin-top: 10px;">
            <label>Заметки</label>
            <textarea id="inputNotes" placeholder="Как прошло..."></textarea>
          </div>
        </div>

        <div class="btn-row">
          <button type="submit" class="btn-primary">Сохранить</button>
          <button type="button" class="btn-secondary" id="refreshBtn">Обновить статистику</button>
        </div>

        <div class="status" id="statusMsg"></div>
      </form>
    </div>

    <!-- Графики -->
    <div class="chart-card">
      <h3>Расход калорий (Активность)</h3>
      <div class="chart-container">
        <canvas id="activityChart"></canvas>
      </div>
    </div>

    <div class="chart-card">
      <h3>Потребление калорий (Питание)</h3>
      <div class="chart-container">
        <canvas id="nutritionChart"></canvas>
      </div>
    </div>
  </div>

<script>
  // ====================== НАСТРОЙКИ ======================
  const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxcqrKN9yEn-mzbjHNmizhsEtbmBezYIksjg5_IcxgmlDXWjy-FUFQX-VoEauvXtx0/exec';
  const SHEET_ID = '1rYEecH-H5h0zCBcw-dyTcVqO4rCg3vpNh70Q4yW2ns0';
  const API_KEY = 'AIzaSyD6qEm6UvTNbG0vR4cypJX8aZ2C4ZYvNLg';

  // ====================== ЭЛЕМЕНТЫ ======================
  const form = document.getElementById('trackerForm');
  const statusMsg = document.getElementById('statusMsg');
  const sheetSelect = document.getElementById('targetSheet');
  const nutritionFields = document.getElementById('nutritionFields');
  const activityFields = document.getElementById('activityFields');

  document.getElementById('inputDate').valueAsDate = new Date();

  // Переключение форм
  sheetSelect.addEventListener('change', () => {
    const isNutrition = sheetSelect.value === 'КБЖУ и Питание';
    nutritionFields.classList.toggle('hidden', !isNutrition);
    activityFields.classList.toggle('hidden', isNutrition);
  });

  // ====================== ОТПРАВКА ======================
  form.addEventListener('submit', async (e) => {
    e.preventDefault();

    statusMsg.className = 'status loading';
    statusMsg.textContent = 'Отправляю...';

    const sheetName = sheetSelect.value;
    let values = [];

    if (sheetName === 'КБЖУ и Питание') {
      values = [
        document.getElementById('inputDate').value,
        document.getElementById('inputName').value,
        document.getElementById('inputMeal').value,
        document.getElementById('inputDish').value,
        Number(document.getElementById('inputWeight').value) || 0,
        Number(document.getElementById('inputCalories').value) || 0,
        Number(document.getElementById('inputProtein').value) || 0,
        Number(document.getElementById('inputFat').value) || 0,
        Number(document.getElementById('inputCarbs').value) || 0
      ];
    } else {
      values = [
        document.getElementById('inputDate').value,
        document.getElementById('inputName').value,
        document.getElementById('inputActivity').value,
        document.getElementById('inputLocation').value,
        Number(document.getElementById('inputDuration').value) || 0,
        Number(document.getElementById('inputBurned').value) || 0,
        '',
        document.getElementById('inputNotes').value
      ];
    }

    try {
      await fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify({ sheetName, values })
      });

      statusMsg.className = 'status success';
      statusMsg.textContent = 'Запись отправлена! Обновляю статистику...';

      // Очистка
      if (sheetName === 'КБЖУ и Питание') {
        ['inputDish','inputWeight','inputCalories','inputProtein','inputFat','inputCarbs']
          .forEach(id => document.getElementById(id).value = '');
      } else {
        document.getElementById('inputDuration').value = '';
        document.getElementById('inputBurned').value = '';
        document.getElementById('inputNotes').value = '';
      }

      setTimeout(refreshStats, 1500);

    } catch (err) {
      statusMsg.className = 'status error';
      statusMsg.textContent = 'Ошибка отправки';
      console.error(err);
    }
  });

  // ====================== СТАТИСТИКА ======================
  let activityChart = null;
  let nutritionChart = null;

  async function fetchSheet(range) {
    const url = `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/${encodeURIComponent(range)}?key=${API_KEY}`;
    try {
      const res = await fetch(url);
      const data = await res.json();
      return data.values || [];
    } catch {
      return [];
    }
  }

  function processData(rows, calorieIndex) {
    const result = {};
    rows.forEach(row => {
      if (!row || row.length < 2) return;
      const date = row[0];
      const name = row[1];
      const cal = parseInt(row[calorieIndex]) || 0;
      if (!date || !name) return;
      if (!result[date]) result[date] = { 'Вениамин': 0, 'Дарья': 0 };
      if (name === 'Вениамин' || name === 'Дарья') {
        result[date][name] += cal;
      }
    });
    return result;
  }

  function renderChart(canvasId, data, oldChart) {
    if (oldChart) oldChart.destroy();
    const labels = Object.keys(data).sort();
    const ven = labels.map(d => data[d]['Вениамин'] || 0);
    const dar = labels.map(d => data[d]['Дарья'] || 0);

    return new Chart(document.getElementById(canvasId), {
      type: 'bar',
      data: {
        labels: labels.length ? labels : ['Нет данных'],
        datasets: [
          { label: 'Вениамин', data: labels.length ? ven : [0], backgroundColor: 'rgba(91,141,239,0.85)', borderRadius: 5 },
          { label: 'Дарья', data: labels.length ? dar : [0], backgroundColor: 'rgba(52,211,153,0.85)', borderRadius: 5 }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { labels: { color: '#9aa0a6' } } },
        scales: {
          x: { ticks: { color: '#9aa0a6' }, grid: { color: 'rgba(255,255,255,0.05)' } },
          y: { beginAtZero: true, ticks: { color: '#9aa0a6' }, grid: { color: 'rgba(255,255,255,0.05)' } }
        }
      }
    });
  }

  async function refreshStats() {
    statusMsg.className = 'status loading';
    statusMsg.textContent = 'Обновляю статистику...';

    const [actRows, nutRows] = await Promise.all([
      fetchSheet('Активность!B9:I'),
      fetchSheet('КБЖУ и Питание!B10:J')
    ]);

    const actData = processData(actRows, 5); // Сожжено в колонке G (индекс 5)
    const nutData = processData(nutRows, 5); // Калории в колонке G (индекс 5)

    activityChart = renderChart('activityChart', actData, activityChart);
    nutritionChart = renderChart('nutritionChart', nutData, nutritionChart);

    // Сегодня
    const today = new Date().toISOString().slice(0, 10);
    const findToday = (data) => {
      for (let key in data) {
        if (key.includes(today.slice(5)) || key === today) return data[key];
      }
      return { 'Вениамин': 0, 'Дарья': 0 };
    };

    const actToday = findToday(actData);
    const nutToday = findToday(nutData);

    document.getElementById('statVenBurn').textContent = (actToday['Вениамин'] || 0) + ' ккал';
    document.getElementById('statDarBurn').textContent = (actToday['Дарья'] || 0) + ' ккал';
    document.getElementById('statVenEat').textContent = (nutToday['Вениамин'] || 0) + ' ккал';
    document.getElementById('statDarEat').textContent = (nutToday['Дарья'] || 0) + ' ккал';

    statusMsg.className = 'status success';
    statusMsg.textContent = 'Статистика обновлена';
    setTimeout(() => statusMsg.textContent = '', 2000);
  }

  document.getElementById('refreshBtn').addEventListener('click', refreshStats);

  // Первый запуск
  refreshStats();
</script>
</body>
</html>
