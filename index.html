<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Трекер • Вениамин & Дарья</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg: #0c0e14;
      --card: #14171f;
      --border: #1e2230;
      --text: #e6e8ee;
      --muted: #8b90a0;
      --primary: #6b8cff;
      --green: #4ade80;
      --orange: #fbbf24;
      --red: #f87171;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 20px 16px;
      line-height: 1.45;
    }

    .container { max-width: 980px; margin: 0 auto; }

    header {
      text-align: center;
      margin-bottom: 28px;
    }

    header h1 {
      font-size: 1.55rem;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    header p {
      color: var(--muted);
      font-size: 0.9rem;
      margin-top: 3px;
    }

    .weight-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 24px;
    }

    .weight-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
    }

    .weight-card h3 {
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 10px;
    }

    .weight-value {
      font-size: 1.7rem;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .weight-meta {
      font-size: 0.8rem;
      color: var(--muted);
    }

    .ven .weight-value { color: var(--primary); }
    .dar .weight-value { color: var(--green); }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-bottom: 24px;
    }

    .stat-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      text-align: center;
    }

    .stat-card .label {
      font-size: 0.72rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    .stat-card .value {
      font-size: 1.2rem;
      font-weight: 600;
      margin-top: 3px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 20px;
    }

    .card h2 {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 14px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 12px;
      margin-bottom: 12px;
    }

    label {
      display: block;
      font-size: 0.76rem;
      color: var(--muted);
      margin-bottom: 4px;
    }

    input, select, textarea {
      width: 100%;
      padding: 8px 11px;
      background: #0c0e14;
      border: 1px solid var(--border);
      border-radius: 7px;
      color: var(--text);
      font-size: 0.9rem;
    }

    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--primary);
    }

    textarea { min-height: 60px; resize: vertical; }

    .btn-row {
      display: flex;
      gap: 8px;
      margin-top: 6px;
    }

    button {
      padding: 9px 16px;
      border-radius: 7px;
      font-weight: 500;
      font-size: 0.88rem;
      cursor: pointer;
      border: none;
    }

    .btn-primary {
      background: var(--primary);
      color: white;
    }

    .btn-secondary {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
    }

    .status {
      margin-top: 10px;
      font-size: 0.85rem;
      min-height: 18px;
    }
    .status.success { color: var(--green); }
    .status.error { color: var(--red); }
    .status.loading { color: var(--orange); }

    .hidden { display: none !important; }

    .chart-container {
      position: relative;
      height: 240px;
    }

    @media (max-width: 650px) {
      .weight-grid, .stats { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Трекер</h1>
      <p>Вениамин & Дарья</p>
    </header>

    <!-- Вес -->
    <div class="weight-grid">
      <div class="weight-card ven">
        <h3>Вениамин</h3>
        <div class="weight-value" id="venWeight">— кг</div>
        <div class="weight-meta" id="venMeta">Старт 93.00 → Цель 87.00</div>
      </div>
      <div class="weight-card dar">
        <h3>Дарья</h3>
        <div class="weight-value" id="darWeight">— кг</div>
        <div class="weight-meta" id="darMeta">Старт 64.00 → Цель 60.00</div>
      </div>
    </div>

    <!-- Калории сегодня -->
    <div class="stats">
      <div class="stat-card">
        <div class="label">Вен сожжено</div>
        <div class="value" id="statVenBurn">—</div>
      </div>
      <div class="stat-card">
        <div class="label">Дарья сожжено</div>
        <div class="value" id="statDarBurn">—</div>
      </div>
      <div class="stat-card">
        <div class="label">Вен съедено</div>
        <div class="value" id="statVenEat">—</div>
      </div>
      <div class="stat-card">
        <div class="label">Дарья съедено</div>
        <div class="value" id="statDarEat">—</div>
      </div>
    </div>

    <!-- Форма -->
    <div class="card">
      <h2>Добавить запись</h2>

      <form id="trackerForm">
        <div class="form-grid">
          <div>
            <label>Тип записи</label>
            <select id="targetSheet">
              <option value="КБЖУ и Питание">Питание</option>
              <option value="Активность">Активность</option>
              <option value="Профиль и Вес">Взвешивание</option>
            </select>
          </div>
          <div>
            <label>Дата</label>
            <input type="date" id="inputDate">
          </div>
          <div>
            <label>Участник</label>
            <select id="inputName">
              <option value="Вениамин">Вениамин</option>
              <option value="Дарья">Дарья</option>
            </select>
          </div>
        </div>

        <!-- Питание -->
        <div id="nutritionFields">
          <div class="form-grid">
            <div>
              <label>Прием пищи</label>
              <select id="inputMeal">
                <option value="Завтрак">Завтрак</option>
                <option value="Обед">Обед</option>
                <option value="Ужин">Ужин</option>
                <option value="Перекус">Перекус</option>
              </select>
            </div>
            <div>
              <label>Блюдо</label>
              <input type="text" id="inputDish" placeholder="Что ел(а)">
            </div>
            <div>
              <label>Вес (г)</label>
              <input type="number" id="inputWeightFood" min="0" placeholder="0">
            </div>
            <div>
              <label>Калории</label>
              <input type="number" id="inputCalories" min="0" placeholder="0">
            </div>
            <div>
              <label>Белки</label>
              <input type="number" id="inputProtein" min="0" step="0.1" placeholder="0">
            </div>
            <div>
              <label>Жиры</label>
              <input type="number" id="inputFat" min="0" step="0.1" placeholder="0">
            </div>
            <div>
              <label>Углеводы</label>
              <input type="number" id="inputCarbs" min="0" step="0.1" placeholder="0">
            </div>
          </div>
        </div>

        <!-- Активность -->
        <div id="activityFields" class="hidden">
          <div class="form-grid">
            <div>
              <label>Вид активности</label>
              <select id="inputActivity">
                <option value="Силовая (зал)">Силовая (зал)</option>
                <option value="Кардио">Кардио</option>
                <option value="Домашняя тренировка">Домашняя</option>
                <option value="Прогулка">Прогулка</option>
                <option value="Бег">Бег</option>
                <option value="Другое">Другое</option>
              </select>
            </div>
            <div>
              <label>Локация</label>
              <select id="inputLocation">
                <option value="Зал">Зал</option>
                <option value="Дом">Дом</option>
                <option value="Улица">Улица</option>
                <option value="Парк">Парк</option>
              </select>
            </div>
            <div>
              <label>Минут</label>
              <input type="number" id="inputDuration" min="0" placeholder="0">
            </div>
            <div>
              <label>Сожжено</label>
              <input type="number" id="inputBurned" min="0" placeholder="0">
            </div>
          </div>
          <div style="margin-top: 6px;">
            <label>Заметки</label>
            <textarea id="inputNotes" placeholder="Как прошло..."></textarea>
          </div>
        </div>

        <!-- Взвешивание -->
        <div id="weightFields" class="hidden">
          <div class="form-grid">
            <div>
              <label>Вес (кг)</label>
              <input type="number" id="inputBodyWeight" min="0" step="0.01" placeholder="0.00">
            </div>
            <div>
              <label>Заметки</label>
              <input type="text" id="inputWeightNotes" placeholder="Утро / вечер...">
            </div>
          </div>
        </div>

        <div class="btn-row">
          <button type="submit" class="btn-primary">Сохранить</button>
          <button type="button" class="btn-secondary" id="refreshBtn">Обновить</button>
        </div>

        <div class="status" id="statusMsg"></div>
      </form>
    </div>

    <!-- Графики -->
    <div class="card">
      <h2>Динамика веса</h2>
      <div class="chart-container">
        <canvas id="weightChart"></canvas>
      </div>
    </div>

    <div class="card">
      <h2>Расход калорий</h2>
      <div class="chart-container">
        <canvas id="activityChart"></canvas>
      </div>
    </div>

    <div class="card">
      <h2>Потребление калорий</h2>
      <div class="chart-container">
        <canvas id="nutritionChart"></canvas>
      </div>
    </div>
  </div>

<script>
  const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxcqrKN9yEn-mzbjHNmizhsEtbmBezYIksjg5_IcxgmlDXWjy-FUFQX-VoEauvXtx0/exec';
  const SHEET_ID = '1rYEecH-H5h0zCBcw-dyTcVqO4rCg3vpNh70Q4yW2ns0';
  const API_KEY = 'AIzaSyD6qEm6UvTNbG0vR4cypJX8aZ2C4ZYvNLg';

  const weightGoals = {
    'Вениамин': { start: 93.00, goal: 87.00 },
    'Дарья': { start: 64.00, goal: 60.00 }
  };

  document.getElementById('inputDate').valueAsDate = new Date();

  const sheetSelect = document.getElementById('targetSheet');
  const nutritionFields = document.getElementById('nutritionFields');
  const activityFields = document.getElementById('activityFields');
  const weightFields = document.getElementById('weightFields');

  sheetSelect.addEventListener('change', () => {
    const val = sheetSelect.value;
    nutritionFields.classList.toggle('hidden', val !== 'КБЖУ и Питание');
    activityFields.classList.toggle('hidden', val !== 'Активность');
    weightFields.classList.toggle('hidden', val !== 'Профиль и Вес');
  });

  document.getElementById('trackerForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const status = document.getElementById('statusMsg');
    status.className = 'status loading';
    status.textContent = 'Сохраняю...';

    const sheetName = sheetSelect.value;
    let values = [];

    if (sheetName === 'КБЖУ и Питание') {
      values = [
        document.getElementById('inputDate').value,
        document.getElementById('inputName').value,
        document.getElementById('inputMeal').value,
        document.getElementById('inputDish').value,
        Number(document.getElementById('inputWeightFood').value) || 0,
        Number(document.getElementById('inputCalories').value) || 0,
        Number(document.getElementById('inputProtein').value) || 0,
        Number(document.getElementById('inputFat').value) || 0,
        Number(document.getElementById('inputCarbs').value) || 0
      ];
    } else if (sheetName === 'Активность') {
      values = [
        document.getElementById('inputDate').value,
        document.getElementById('inputName').value,
        document.getElementById('inputActivity').value,
        document.getElementById('inputLocation').value,
        Number(document.getElementById('inputDuration').value) || 0,
        Number(document.getElementById('inputBurned').value) || 0,
        '',
        document.getElementById('inputNotes').value
      ];
    } else {
      values = [
        document.getElementById('inputDate').value,
        document.getElementById('inputName').value,
        Number(document.getElementById('inputBodyWeight').value) || 0,
        '', '', '',
        document.getElementById('inputWeightNotes').value
      ];
    }

    try {
      await fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify({ sheetName, values })
      });

      status.className = 'status success';
      status.textContent = 'Сохранено';

      if (sheetName === 'КБЖУ и Питание') {
        ['inputDish','inputWeightFood','inputCalories','inputProtein','inputFat','inputCarbs']
          .forEach(id => document.getElementById(id).value = '');
      } else if (sheetName === 'Активность') {
        document.getElementById('inputDuration').value = '';
        document.getElementById('inputBurned').value = '';
        document.getElementById('inputNotes').value = '';
      } else {
        document.getElementById('inputBodyWeight').value = '';
        document.getElementById('inputWeightNotes').value = '';
      }

      setTimeout(refreshAll, 1500);
    } catch (err) {
      status.className = 'status error';
      status.textContent = 'Ошибка';
      console.error(err);
    }
  });

  let weightChart, activityChart, nutritionChart;

  async function fetchSheet(range) {
    try {
      const res = await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/${encodeURIComponent(range)}?key=${API_KEY}`);
      const data = await res.json();
      return data.values || [];
    } catch {
      return [];
    }
  }

  function processCalories(rows, calIndex) {
    const result = {};
    rows.forEach(row => {
      if (!row || row.length < 2) return;
      const date = row[0], name = row[1];
      const cal = parseInt(row[calIndex]) || 0;
      if (!date || !name) return;
      if (!result[date]) result[date] = { 'Вениамин': 0, 'Дарья': 0 };
      if (name === 'Вениамин' || name === 'Дарья') result[date][name] += cal;
    });
    return result;
  }

  function processWeight(rows) {
    const result = { 'Вениамин': [], 'Дарья': [] };
    rows.forEach(row => {
      if (!row || row.length < 3) return;
      const date = row[0], name = row[1], weight = parseFloat(row[2]);
      if (date && name && !isNaN(weight) && result[name]) {
        result[name].push({ date, weight });
      }
    });
    return result;
  }

  function renderBarChart(canvasId, data, oldChart) {
    if (oldChart) oldChart.destroy();
    const labels = Object.keys(data).sort();
    const ven = labels.map(d => data[d]['Вениамин'] || 0);
    const dar = labels.map(d => data[d]['Дарья'] || 0);

    return new Chart(document.getElementById(canvasId), {
      type: 'bar',
      data: {
        labels: labels.length ? labels : ['Нет данных'],
        datasets: [
          { label: 'Вениамин', data: labels.length ? ven : [0], backgroundColor: 'rgba(107,140,255,0.75)', borderRadius: 3 },
          { label: 'Дарья', data: labels.length ? dar : [0], backgroundColor: 'rgba(74,222,128,0.75)', borderRadius: 3 }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { labels: { color: '#8b90a0', boxWidth: 10 } } },
        scales: {
          x: { ticks: { color: '#8b90a0', font: { size: 11 } }, grid: { display: false } },
          y: { beginAtZero: true, ticks: { color: '#8b90a0', font: { size: 11 } }, grid: { color: 'rgba(255,255,255,0.04)' } }
        }
      }
    });
  }

  function renderWeightChart(data, oldChart) {
    if (oldChart) oldChart.destroy();

    const allDates = [...new Set([
      ...data['Вениамин'].map(x => x.date),
      ...data['Дарья'].map(x => x.date)
    ])].sort();

    const venData = allDates.map(d => {
      const item = data['Вениамин'].find(x => x.date === d);
      return item ? item.weight : null;
    });

    const darData = allDates.map(d => {
      const item = data['Дарья'].find(x => x.date === d);
      return item ? item.weight : null;
    });

    return new Chart(document.getElementById('weightChart'), {
      type: 'line',
      data: {
        labels: allDates.length ? allDates : ['Нет данных'],
        datasets: [
          {
            label: 'Вениамин',
            data: allDates.length ? venData : [],
            borderColor: '#6b8cff',
            backgroundColor: 'rgba(107,140,255,0.1)',
            tension: 0.3,
            spanGaps: true
          },
          {
            label: 'Дарья',
            data: allDates.length ? darData : [],
            borderColor: '#4ade80',
            backgroundColor: 'rgba(74,222,128,0.1)',
            tension: 0.3,
            spanGaps: true
          }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { labels: { color: '#8b90a0', boxWidth: 10 } } },
        scales: {
          x: { ticks: { color: '#8b90a0', font: { size: 11 } }, grid: { display: false } },
          y: { ticks: { color: '#8b90a0', font: { size: 11 } }, grid: { color: 'rgba(255,255,255,0.04)' } }
        }
      }
    });
  }

  async function refreshAll() {
    const [actRows, nutRows, weightRows] = await Promise.all([
      fetchSheet('Активность!B9:I'),
      fetchSheet('КБЖУ и Питание!B10:J'),
      fetchSheet('Профиль и Вес!B14:H')
    ]);

    const actData = processCalories(actRows, 5);
    const nutData = processCalories(nutRows, 5);
    const weightData = processWeight(weightRows);

    activityChart = renderBarChart('activityChart', actData, activityChart);
    nutritionChart = renderBarChart('nutritionChart', nutData, nutritionChart);
    weightChart = renderWeightChart(weightData, weightChart);

    // Текущий вес (точный до сотых)
    const lastVen = weightData['Вениамин'].slice(-1)[0];
    const lastDar = weightData['Дарья'].slice(-1)[0];

    document.getElementById('venWeight').textContent = lastVen ? lastVen.weight.toFixed(2) + ' кг' : '— кг';
    document.getElementById('darWeight').textContent = lastDar ? lastDar.weight.toFixed(2) + ' кг' : '— кг';

    if (lastVen) {
      const diff = (lastVen.weight - weightGoals['Вениамин'].start).toFixed(2);
      const left = (lastVen.weight - weightGoals['Вениамин'].goal).toFixed(2);
      document.getElementById('venMeta').textContent = `К старту: ${diff} кг • До цели: ${left} кг`;
    }

    if (lastDar) {
      const diff = (lastDar.weight - weightGoals['Дарья'].start).toFixed(2);
      const left = (lastDar.weight - weightGoals['Дарья'].goal).toFixed(2);
      document.getElementById('darMeta').textContent = `К старту: ${diff} кг • До цели: ${left} кг`;
    }

    // Калории сегодня
    const today = new Date().toISOString().slice(0, 10);
    const findToday = (data) => {
      for (let key in data) {
        if (key.includes(today.slice(5)) || key === today) return data[key];
      }
      return { 'Вениамин': 0, 'Дарья': 0 };
    };

    const actToday = findToday(actData);
    const nutToday = findToday(nutData);

    document.getElementById('statVenBurn').textContent = actToday['Вениамин'] || 0;
    document.getElementById('statDarBurn').textContent = actToday['Дарья'] || 0;
    document.getElementById('statVenEat').textContent = nutToday['Вениамин'] || 0;
    document.getElementById('statDarEat').textContent = nutToday['Дарья'] || 0;
  }

  document.getElementById('refreshBtn').addEventListener('click', refreshAll);
  refreshAll();
</script>
</body>
</html>
