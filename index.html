<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Трекер • Вениамин & Дарья</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg: #0f1117;
      --card: #1a1d27;
      --border: #2a2e3b;
      --text: #e8eaed;
      --muted: #9aa0a6;
      --primary: #5b8def;
      --primary-hover: #4a7de0;
      --green: #34d399;
      --orange: #fbbf24;
      --red: #f87171;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 20px;
      min-height: 100vh;
    }

    .container { max-width: 980px; margin: 0 auto; }

    header {
      text-align: center;
      margin-bottom: 28px;
    }

    header h1 {
      font-size: 1.7rem;
      font-weight: 700;
      background: linear-gradient(90deg, #5b8def, #34d399);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    header p { color: var(--muted); margin-top: 4px; }

    .form-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 28px;
    }

    .form-card h2 {
      font-size: 1.15rem;
      margin-bottom: 20px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 14px;
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 0.83rem;
      color: var(--muted);
      margin-bottom: 5px;
    }

    input, select, textarea {
      width: 100%;
      padding: 10px 12px;
      background: #12141c;
      border: 1px solid var(--border);
      border-radius: 9px;
      color: var(--text);
      font-size: 0.95rem;
    }

    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--primary);
    }

    textarea { min-height: 70px; resize: vertical; }

    .btn-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 10px;
    }

    button {
      padding: 11px 22px;
      border: none;
      border-radius: 9px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
    }

    .btn-primary {
      background: var(--primary);
      color: white;
    }
    .btn-primary:hover { background: var(--primary-hover); }

    .btn-secondary {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
    }

    .status {
      margin-top: 14px;
      font-size: 0.9rem;
      min-height: 22px;
    }
    .status.success { color: var(--green); }
    .status.error { color: var(--red); }
    .status.loading { color: var(--orange); }

    .hidden { display: none !important; }

    @media (max-width: 600px) {
      body { padding: 12px; }
      header h1 { font-size: 1.4rem; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Трекер активности и питания</h1>
      <p>Вениамин & Дарья</p>
    </header>

    <div class="form-card">
      <h2>Добавить запись</h2>

      <form id="trackerForm">
        <!-- Общие поля -->
        <div class="form-grid">
          <div>
            <label>Тип записи</label>
            <select id="targetSheet">
              <option value="КБЖУ и Питание">🥗 Питание</option>
              <option value="Активность">🔥 Активность</option>
            </select>
          </div>

          <div>
            <label>Дата</label>
            <input type="date" id="inputDate" required>
          </div>

          <div>
            <label>Участник</label>
            <select id="inputName">
              <option value="Вениамин">Вениамин</option>
              <option value="Дарья">Дарья</option>
            </select>
          </div>
        </div>

        <!-- ========== БЛОК ПИТАНИЯ ========== -->
        <div id="nutritionFields">
          <div class="form-grid">
            <div>
              <label>Прием пищи</label>
              <select id="inputMeal">
                <option value="Завтрак">Завтрак</option>
                <option value="Обед">Обед</option>
                <option value="Ужин">Ужин</option>
                <option value="Перекус">Перекус</option>
                <option value="Другое">Другое</option>
              </select>
            </div>

            <div>
              <label>Блюдо / Продукт</label>
              <input type="text" id="inputDish" placeholder="Овсянка, курица, банан...">
            </div>

            <div>
              <label>Вес (г)</label>
              <input type="number" id="inputWeight" min="0" step="1" placeholder="0">
            </div>

            <div>
              <label>Калории (ккал)</label>
              <input type="number" id="inputCalories" min="0" step="1" placeholder="0" required>
            </div>

            <div>
              <label>Белки (г)</label>
              <input type="number" id="inputProtein" min="0" step="0.1" placeholder="0">
            </div>

            <div>
              <label>Жиры (г)</label>
              <input type="number" id="inputFat" min="0" step="0.1" placeholder="0">
            </div>

            <div>
              <label>Углеводы (г)</label>
              <input type="number" id="inputCarbs" min="0" step="0.1" placeholder="0">
            </div>
          </div>
        </div>

        <!-- ========== БЛОК АКТИВНОСТИ ========== -->
        <div id="activityFields" class="hidden">
          <div class="form-grid">
            <div>
              <label>Вид активности</label>
              <select id="inputActivity">
                <option value="Силовая (зал)">Силовая (зал)</option>
                <option value="Кардио">Кардио</option>
                <option value="Домашняя тренировка">Домашняя тренировка</option>
                <option value="Прогулка">Прогулка</option>
                <option value="Бег">Бег</option>
                <option value="Велосипед">Велосипед</option>
                <option value="Растяжка / Йога">Растяжка / Йога</option>
                <option value="Другое">Другое</option>
              </select>
            </div>

            <div>
              <label>Локация</label>
              <select id="inputLocation">
                <option value="Зал">Зал</option>
                <option value="Дом">Дом</option>
                <option value="Улица">Улица</option>
                <option value="Парк">Парк</option>
                <option value="Другое">Другое</option>
              </select>
            </div>

            <div>
              <label>Длительность (мин)</label>
              <input type="number" id="inputDuration" min="0" placeholder="0">
            </div>

            <div>
              <label>Сожжено (ккал)</label>
              <input type="number" id="inputBurned" min="0" placeholder="0" required>
            </div>
          </div>

          <div style="margin-top: 12px;">
            <label>Самочувствие / Заметки</label>
            <textarea id="inputNotes" placeholder="Как прошло, настроение..."></textarea>
          </div>
        </div>

        <div class="btn-row">
          <button type="submit" class="btn-primary">Сохранить в таблицу</button>
        </div>

        <div class="status" id="statusMsg"></div>
      </form>
    </div>
  </div>

<script>
  // ====================== НАСТРОЙКИ ======================
  // ← СЮДА вставь свой актуальный URL Apps Script
  const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxcqrKN9yEn-mzbjHNmizhsEtbmBezYIksjg5_IcxgmlDXWjy-FUFQX-VoEauvXtx0/exec';

  // Сегодняшняя дата
  document.getElementById('inputDate').valueAsDate = new Date();

  // Переключение форм
  const sheetSelect = document.getElementById('targetSheet');
  const nutritionFields = document.getElementById('nutritionFields');
  const activityFields = document.getElementById('activityFields');

  sheetSelect.addEventListener('change', function () {
    if (this.value === 'КБЖУ и Питание') {
      nutritionFields.classList.remove('hidden');
      activityFields.classList.add('hidden');
    } else {
      nutritionFields.classList.add('hidden');
      activityFields.classList.remove('hidden');
    }
  });

  // Отправка формы
  document.getElementById('trackerForm').addEventListener('submit', async (e) => {
    e.preventDefault();

    const status = document.getElementById('statusMsg');
    status.className = 'status loading';
    status.textContent = 'Сохраняю...';

    const sheetName = sheetSelect.value;
    let rowValues = [];

    if (sheetName === 'КБЖУ и Питание') {
      // B → J
      rowValues = [
        document.getElementById('inputDate').value,                    // B Дата
        document.getElementById('inputName').value,                    // C Участник
        document.getElementById('inputMeal').value,                    // D Прием пищи
        document.getElementById('inputDish').value,                    // E Блюдо
        Number(document.getElementById('inputWeight').value) || 0,     // F Вес
        Number(document.getElementById('inputCalories').value) || 0,   // G Калории
        Number(document.getElementById('inputProtein').value) || 0,    // H Белки
        Number(document.getElementById('inputFat').value) || 0,        // I Жиры
        Number(document.getElementById('inputCarbs').value) || 0       // J Углеводы
      ];
    } else {
      // Активность: B → I
      rowValues = [
        document.getElementById('inputDate').value,                    // B Дата
        document.getElementById('inputName').value,                    // C Участник
        document.getElementById('inputActivity').value,                // D Вид активности
        document.getElementById('inputLocation').value,                // E Локация
        Number(document.getElementById('inputDuration').value) || 0,   // F Длительность
        Number(document.getElementById('inputBurned').value) || 0,     // G Сожжено
        '',                                                            // H Неделя (пусто)
        document.getElementById('inputNotes').value                    // I Заметки
      ];
    }

    try {
      await fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          sheetName: sheetName,
          values: rowValues
        })
      });

      status.className = 'status success';
      status.textContent = 'Запись успешно добавлена!';

      // Очистка
      if (sheetName === 'КБЖУ и Питание') {
        document.getElementById('inputDish').value = '';
        document.getElementById('inputWeight').value = '';
        document.getElementById('inputCalories').value = '';
        document.getElementById('inputProtein').value = '';
        document.getElementById('inputFat').value = '';
        document.getElementById('inputCarbs').value = '';
      } else {
        document.getElementById('inputDuration').value = '';
        document.getElementById('inputBurned').value = '';
        document.getElementById('inputNotes').value = '';
      }

    } catch (err) {
      status.className = 'status error';
      status.textContent = 'Ошибка отправки. Проверь URL Apps Script.';
      console.error(err);
    }
  });
</script>
</body>
</html>
