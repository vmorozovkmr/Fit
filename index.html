<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Трекер • Вениамин & Дарья</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg: #0f1117;
      --card: #1a1d27;
      --border: #2a2e3b;
      --text: #e8eaed;
      --muted: #9aa0a6;
      --primary: #5b8def;
      --primary-hover: #4a7de0;
      --green: #34d399;
      --orange: #fbbf24;
      --red: #f87171;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 20px;
      min-height: 100vh;
    }

    .container { max-width: 1100px; margin: 0 auto; }

    header {
      text-align: center;
      margin-bottom: 28px;
    }

    header h1 {
      font-size: 1.75rem;
      font-weight: 700;
      background: linear-gradient(90deg, #5b8def, #34d399);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    header p {
      color: var(--muted);
      margin-top: 4px;
      font-size: 0.95rem;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 14px;
      margin-bottom: 24px;
    }

    .stat-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px;
    }

    .stat-card .label {
      font-size: 0.82rem;
      color: var(--muted);
      margin-bottom: 4px;
    }

    .stat-card .value {
      font-size: 1.45rem;
      font-weight: 700;
    }

    .ven .value { color: var(--primary); }
    .dar .value { color: var(--green); }

    .form-card, .chart-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 22px;
      margin-bottom: 24px;
    }

    .form-card h2, .chart-card h3 {
      font-size: 1.1rem;
      margin-bottom: 18px;
      color: var(--text);
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 14px;
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 0.83rem;
      color: var(--muted);
      margin-bottom: 5px;
    }

    input, select, textarea {
      width: 100%;
      padding: 10px 12px;
      background: #12141c;
      border: 1px solid var(--border);
      border-radius: 9px;
      color: var(--text);
      font-size: 0.95rem;
    }

    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--primary);
    }

    textarea {
      resize: vertical;
      min-height: 70px;
    }

    .btn-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 8px;
    }

    button {
      padding: 11px 22px;
      border: none;
      border-radius: 9px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      transition: 0.2s;
    }

    .btn-primary {
      background: var(--primary);
      color: white;
    }
    .btn-primary:hover { background: var(--primary-hover); }

    .btn-secondary {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
    }
    .btn-secondary:hover { border-color: var(--muted); }

    .status {
      margin-top: 12px;
      font-size: 0.9rem;
      min-height: 22px;
    }
    .status.success { color: var(--green); }
    .status.error { color: var(--red); }
    .status.loading { color: var(--orange); }

    .chart-container {
      position: relative;
      height: 300px;
    }

    @media (max-width: 600px) {
      body { padding: 12px; }
      header h1 { font-size: 1.4rem; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Трекер активности и питания</h1>
      <p>Вениамин & Дарья</p>
    </header>

    <!-- Сводки -->
    <div class="stats">
      <div class="stat-card ven">
        <div class="label">Вениамин • сожжено сегодня</div>
        <div class="value" id="statVenBurn">—</div>
      </div>
      <div class="stat-card dar">
        <div class="label">Дарья • сожжено сегодня</div>
        <div class="value" id="statDarBurn">—</div>
      </div>
      <div class="stat-card ven">
        <div class="label">Вениамин • съедено сегодня</div>
        <div class="value" id="statVenEat">—</div>
      </div>
      <div class="stat-card dar">
        <div class="label">Дарья • съедено сегодня</div>
        <div class="value" id="statDarEat">—</div>
      </div>
    </div>

    <!-- Форма -->
    <div class="form-card">
      <h2>Добавить запись</h2>
      <form id="trackerForm">
        <div class="form-grid">
          <div>
            <label>Тип записи</label>
            <select id="targetSheet">
              <option value="Активность">Активность (расход)</option>
              <option value="КБЖУ и Питание">Питание (потребление)</option>
            </select>
          </div>
          <div>
            <label>Дата</label>
            <input type="date" id="inputDate" required>
          </div>
          <div>
            <label>Участник</label>
            <select id="inputName">
              <option value="Вениамин">Вениамин</option>
              <option value="Дарья">Дарья</option>
            </select>
          </div>
          <div>
            <label id="descLabel">Вид активности</label>
            <input type="text" id="inputDesc" placeholder="Зал / Бег / Завтрак..." required>
          </div>
          <div>
            <label id="calLabel">Сожжено (ккал)</label>
            <input type="number" id="inputCalories" min="0" placeholder="0" required>
          </div>
          <div id="durationBlock">
            <label>Длительность (мин)</label>
            <input type="number" id="inputDuration" min="0" placeholder="0">
          </div>
          <div id="locationBlock">
            <label>Локация</label>
            <select id="inputLocation">
              <option value="Зал">Зал</option>
              <option value="Дом">Дом</option>
              <option value="Улица">Улица / Прогулка</option>
              <option value="Другое">Другое</option>
            </select>
          </div>
        </div>

        <div style="margin-bottom: 16px;">
          <label>Заметки / Самочувствие</label>
          <textarea id="inputNotes" placeholder="Как прошло, настроение..."></textarea>
        </div>

        <div class="btn-row">
          <button type="submit" class="btn-primary">Сохранить</button>
          <button type="button" class="btn-secondary" onclick="refreshCharts()">Обновить графики</button>
        </div>
        <div class="status" id="statusMsg"></div>
      </form>
    </div>

    <!-- Графики -->
    <div class="chart-card">
      <h3>Расход калорий (Активность)</h3>
      <div class="chart-container">
        <canvas id="activityChart"></canvas>
      </div>
    </div>

    <div class="chart-card">
      <h3>Потребление калорий (Питание)</h3>
      <div class="chart-container">
        <canvas id="nutritionChart"></canvas>
      </div>
    </div>
  </div>

<script>
  // ====================== НАСТРОЙКИ ======================
  const MY_API_KEY = 'AIzaSyD6qEm6UvTNbG0vR4cypJX8aZ2C4ZYvNLg';
  const SHEET_ID = '1rYEecH-H5h0zCBcw-dyTcVqO4rCg3vpNh70Q4yW2ns0';
  
  // ← СЮДА вставь свой URL веб-приложения Apps Script
  const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxcqrKN9yEn-mzbjHNmizhsEtbmBezYIksjg5_IcxgmlDXWjy-FUFQX-VoEauvXtx0/exec';

  const urlActivity  = `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/${encodeURIComponent('Активность')}!A9:I?key=${MY_API_KEY}`;
  const urlNutrition = `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/${encodeURIComponent('КБЖУ и Питание')}!A9:I?key=${MY_API_KEY}`;

  let activityChartInstance = null;
  let nutritionChartInstance = null;

  // Сегодняшняя дата по умолчанию
  document.getElementById('inputDate').valueAsDate = new Date();

  // Меняем поля в зависимости от типа
  document.getElementById('targetSheet').addEventListener('change', function () {
    const isActivity = this.value === 'Активность';
    document.getElementById('descLabel').textContent = isActivity ? 'Вид активности' : 'Блюдо / Приём пищи';
    document.getElementById('calLabel').textContent = isActivity ? 'Сожжено (ккал)' : 'Калории (ккал)';
    document.getElementById('durationBlock').style.display = isActivity ? 'block' : 'none';
    document.getElementById('locationBlock').style.display = isActivity ? 'block' : 'none';
  });

  // ====================== ФУНКЦИИ ======================
  async function fetchData(url) {
    try {
      const res = await fetch(url);
      if (!res.ok) throw new Error(res.status);
      const data = await res.json();
      return data.values || [];
    } catch (e) {
      console.error(e);
      return [];
    }
  }

  function processRows(rows) {
    const result = {};
    rows.forEach(row => {
      if (!row || row.length < 2) return;
      const date = row[0];
      const name = row[1];
      const calories = parseInt(String(row[5] || 0).replace(/[^\d]/g, '')) || 0;

      if (!date || !name) return;
      if (!result[date]) result[date] = { 'Вениамин': 0, 'Дарья': 0 };
      if (name === 'Вениамин' || name === 'Дарья') {
        result[date][name] += calories;
      }
    });
    return result;
  }

  function renderChart(canvasId, dataByDate, oldInstance) {
    if (oldInstance) oldInstance.destroy();

    const labels = Object.keys(dataByDate).sort((a, b) => new Date(a) - new Date(b));
    const ven = labels.map(d => dataByDate[d]['Вениамин'] || 0);
    const dar = labels.map(d => dataByDate[d]['Дарья'] || 0);

    const ctx = document.getElementById(canvasId).getContext('2d');
    return new Chart(ctx, {
      type: 'bar',
      data: {
        labels: labels.length ? labels : ['Нет данных'],
        datasets: [
          {
            label: 'Вениамин',
            data: labels.length ? ven : [0],
            backgroundColor: 'rgba(91, 141, 239, 0.85)',
            borderRadius: 5
          },
          {
            label: 'Дарья',
            data: labels.length ? dar : [0],
            backgroundColor: 'rgba(52, 211, 153, 0.85)',
            borderRadius: 5
          }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { labels: { color: '#9aa0a6' } }
        },
        scales: {
          x: { ticks: { color: '#9aa0a6' }, grid: { color: 'rgba(255,255,255,0.04)' } },
          y: { beginAtZero: true, ticks: { color: '#9aa0a6' }, grid: { color: 'rgba(255,255,255,0.04)' } }
        }
      }
    });
  }

  function updateTodayStats(actData, nutData) {
    const today = new Date().toISOString().slice(0, 10);
    
    function getToday(data) {
      // Пробуем разные форматы даты
      for (let key in data) {
        if (key.includes(today.slice(8)) || key.includes(today.slice(5)) || key === today) {
          return data[key];
        }
      }
      return { 'Вениамин': 0, 'Дарья': 0 };
    }

    const act = getToday(actData);
    const nut = getToday(nutData);

    document.getElementById('statVenBurn').textContent = (act['Вениамин'] || 0) + ' ккал';
    document.getElementById('statDarBurn').textContent = (act['Дарья'] || 0) + ' ккал';
    document.getElementById('statVenEat').textContent = (nut['Вениамин'] || 0) + ' ккал';
    document.getElementById('statDarEat').textContent = (nut['Дарья'] || 0) + ' ккал';
  }

  async function refreshCharts() {
    const status = document.getElementById('statusMsg');
    status.className = 'status loading';
    status.textContent = 'Обновляю...';

    const [actRows, nutRows] = await Promise.all([
      fetchData(urlActivity),
      fetchData(urlNutrition)
    ]);

    const actData = processRows(actRows);
    const nutData = processRows(nutRows);

    activityChartInstance = renderChart('activityChart', actData, activityChartInstance);
    nutritionChartInstance = renderChart('nutritionChart', nutData, nutritionChartInstance);
    updateTodayStats(actData, nutData);

    status.className = 'status success';
    status.textContent = 'Обновлено';
    setTimeout(() => status.textContent = '', 2000);
  }

  // Отправка
  document.getElementById('trackerForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const status = document.getElementById('statusMsg');
    status.className = 'status loading';
    status.textContent = 'Сохраняю...';

    const sheetName = document.getElementById('targetSheet').value;
    const isActivity = sheetName === 'Активность';

    // Порядок под твой скрипт (пишет с колонки B):
    // B: Дата, C: Участник, D: Описание, E: Локация, F: Длительность, G: Калории, H: Неделя, I: Заметки
    const rowValues = [
      document.getElementById('inputDate').value,
      document.getElementById('inputName').value,
      document.getElementById('inputDesc').value,
      isActivity ? document.getElementById('inputLocation').value : '',
      isActivity ? (Number(document.getElementById('inputDuration').value) || 0) : '',
      Number(document.getElementById('inputCalories').value) || 0,
      '', // Неделя (можно потом формулой)
      document.getElementById('inputNotes').value
    ];

    try {
      await fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          sheetName: sheetName,
          values: rowValues
        })
      });

      status.className = 'status success';
      status.textContent = 'Запись отправлена!';

      // Очистка полей
      document.getElementById('inputDesc').value = '';
      document.getElementById('inputCalories').value = '';
      document.getElementById('inputDuration').value = '';
      document.getElementById('inputNotes').value = '';

      setTimeout(refreshCharts, 1500);
    } catch (err) {
      status.className = 'status error';
      status.textContent = 'Ошибка отправки';
      console.error(err);
    }
  });

  // Старт
  refreshCharts();
</script>
</body>
</html>
